[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "0.1.0"
description = "Local real-time voice-to-text input daemon for Linux desktops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sounddevice>=0.4.7",
  "vosk>=0.3.45",
]

[project.scripts]
voice-input = "voice_input.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
